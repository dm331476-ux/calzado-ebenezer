<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calzado Ebenezer - Sistema de Gestión</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="contenedor-login">

        <header class="login-header" style="display: flex; justify-content: center; align-items: center; flex-direction: column; padding: 20px 0; gap: 10px;">
    
    <img src="img/logo.png" alt="Logo Calzado Ebenezer" style="width: 100px; height: auto; object-fit: contain;">
    
    <h1 style="font-family: 'Playfair Display', serif; color: #5d4037;">
    INICIAR SESIÓN</h1>

    <p style="margin: 0; font-size: 0.9rem; color: #757575; text-align: center;">
            Sistema de Gestión de Ventas e Inventario
        </p>
        </header>

        <form id="loginForm" class="form-login">
            <div class="grupo-input">
                <label for="userLogin">Usuario o Correo</label>
                <input type="text" id="userLogin" placeholder="Ingrese su usuario" required>
            </div>

           <div class="grupo-input">
    <label for="passLogin">Contraseña</label>
    <div class="contenedor-password-ojo">
        <input type="password" id="passLogin" placeholder="Ingresa tu contraseña" required>
        <button type="button" class="btn-ojo" onclick="alternarContrasena('passLogin', this)">👁️</button>
    </div>

            <button type="submit" class="btn-ingresar">INGRESAR</button>
        </form>

        <footer class="login-footer">
            <p>¿No tiene una cuenta administrativa? <a href="registro.html">Regístrese aquí</a></p>
        </footer>
    </main>

    <div class="pantalla-oscura" id="capaError">
        <div class="notificacion-ebenezer">
            
            <div class="cabecera-transparente">
                <div class="icono-circular-rojo">
                    <span>X</span>
                </div>
                <h2>ERROR DE ACCESO</h2>
            </div>

            <img src="img/linea-sombra.PNG" alt="divisor" class="linea-divisor-PNG">

            <div class="cuerpo-notificacion">
                <p class="mensaje-italico">"Datos incorrectos"</p>
                
                <div class="contenedor-codigo">
                    <span class="etiqueta-codigo">CODE:</span>
                    <span class="numero-codigo">#001</span>
                </div>

                <p class="instruccion-gris">Verifique sus credenciales y reintente.</p>
                
                <button type="button" class="btn-reintentar-transp" id="btnCerrarError">REINTENTAR</button>
            </div>
        </div>
    </div>
    <script src="js/autenticacion.js"></script>
</body>
</html>
